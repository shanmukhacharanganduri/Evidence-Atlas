[browser]
gatherUsageStats = false

[server]
headless = true

# Single authority for the colour palette. app.py mirrors these values for its own components
# (tests/test_theme.py fails if they drift). Streamlit follows the system/Settings light-dark choice.
[theme.light]
primaryColor = "#245847"
backgroundColor = "#F7F5F0"
secondaryBackgroundColor = "#ECE9E0"
textColor = "#20201E"

[theme.dark]
primaryColor = "#9BC7AF"
backgroundColor = "#191B1A"
secondaryBackgroundColor = "#242725"
textColor = "#EEEDE7"
